name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks (modules parse, assets exist)
        run: node tests/check.mjs
      - name: Simulation tests
        run: node tests/sim.test.mjs
      - name: Classic edition tests
        run: node classic/tests/smoke.js && node classic/tests/mechanics.js
